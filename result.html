<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/result.css">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <title>Spelling Game</title>
</head>


<body>
    <!-- Container -->
    <div id="container" class="d-flex justify-content-around">
        <div class="container-card">  
           
            <!-- question -->
            <div id="quest">
                <!-- text -->
                <div id="congrats"></div>

                <!-- img -->
                <div class="figure">
                    <img src="img/score.png" class="figure-img img-fluid rounded">
                </div>

                <!-- text -->
                <div class="scoreResult">
                    <p>Your score : </p> 
                    <p id="scoreNumber">0</p>
                </div>
            
                <div class="btnQuest">
                    <!-- button play again-->
                
                        <button id="btn-playAgain">Play again</button>
                   
                    <!-- button Home-->
                     <a href="index.html">
                        <button id="btn-home" >Home</button>
                     </a>
                </div>

            </div>
            

        </div>
        
    </div>
    

</body>

 
<!-- js script -->
 <script >
    //get score from storage
    const score = sessionStorage.getItem("gameScore");
    //get the element scoreNumber
    const scoreNumber = document.getElementById("scoreNumber");
    //put score into the html element
    scoreNumber.textContent = score;


    //get result text from storage
    const resultText = sessionStorage.getItem("resultText");
    //get the element congrats 
    const congrats = document.getElementById("congrats");
    //put score into the html element
    scoreNumber.textContent = score;
    //put result text into the html element
    congrats.textContent = resultText;

    
    //get the element button play again 
    const playAgain = document.getElementById("btn-playAgain");
    playAgain.addEventListener("click",()=>{
        //get current level from storage
        const currentLevel = sessionStorage.getItem("currentLevel");

        //start a new game in the same level
        window.location.href = currentLevel;
    })

 </script>


</html>
